name: Backend CI

on:
  push:

  pull_request:
    branches:
      - main


jobs:
  build:
    
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
     
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Verify Backend Starts
        run: node --check server.js

      - name: Read Variables
        run: |
          echo "Project: ${{ vars.PROJECT_NAME }}"
          echo "Environment: ${{ vars.ENVIRONMENT }}"
          echo "Node Version: ${{ vars.NODE_VERSION }}"

      - name: Read Secret
        run: |
          echo "Secret exists"
          echo "${{ secrets.DEMO_SECRET }}" | wc -c