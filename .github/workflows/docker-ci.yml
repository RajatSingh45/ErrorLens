name: Docker CI

on:
  push:
  
  pull_request:
    branches:
      - main

jobs:
  docker-build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: docker build -t errorlens-backend .