name: Frontend CI

on:
  push:
    branches:
      - main
      - ci-cd

  pull-request:
     branches:
       - main

jobs:
  build:
   
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: Frontend

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm Install

      - name: Build Project
        run: npm run build
    